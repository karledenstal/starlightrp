    <script>
      $(function () {
        const $list = $(".memberlist");
        $list.css("min-height", Math.min($list.outerHeight(), 700));

        const $rows = $(".member-row");
        const $buttons = $(".memberfilter [data-filter]");
        const $search = $(".member-search");

        const normalize = (value) =>
          String(value || "")
            .trim()
            .toLowerCase();

        function filterMembers() {
          const search = normalize($search.val());
          let matchCount = 0;

          const filters = {};

          $buttons.filter(".active").each(function () {
            const key = $(this).data("filter");
            const value = normalize($(this).attr("data-filter-value"));

            (filters[key] ??= []).push(...value.split(",").map(normalize));
          });

          $rows.each(function () {
            const $row = $(this);

            const matchesFilters = Object.entries(filters).every(
              ([key, values]) => {
                const actual = normalize($row.attr(`data-${key}`));

                if (key === "pronouns") {
                  const pronouns = actual
                    .split(/[\/&,\-]/)
                    .map(normalize)
                    .filter(Boolean);

                  const standard = ["he", "him", "his", "she", "her", "hers"];

                  return values.some((value) => {
                    if (value === "other") {
                      return pronouns.some(
                        (pronoun) => !standard.includes(pronoun),
                      );
                    }

                    return pronouns.includes(value);
                  });
                }

                return values.includes(actual);
              },
            );

            const searchable = [
              "name",
              "faceclaim",
              "pronouns",
              "group",
              "affiliation",
              "residence",
              "player",
            ]
              .map((key) => normalize($row.attr(`data-${key}`)))
              .join(" ");

            const matchesSearch = searchable.includes(search);

            const visible = matchesFilters && matchesSearch;

            if (visible) matchCount++;

            $row.stop(true, true)[visible ? "slideDown" : "slideUp"](200);
          });
          $(".members-empty")
            .stop(true, true)
            [matchCount === 0 ? "fadeIn" : "fadeOut"](200);
        }

        $buttons.on("click", function () {
          $(this).toggleClass("active");
          filterMembers();
        });

        $search.on("input", filterMembers);
      });
    </script>
    <script type="module" src="../scripts/particles.js"></script>
